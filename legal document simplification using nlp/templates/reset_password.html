{% extends "base.html" %}

{% block content %}
<div class="container py-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="premium-card p-5 shadow-lg animate-fade-up">
                <div class="text-center mb-4">
                    <div class="stats-icon mx-auto mb-3">
                        <i class="fa-solid fa-lock-open text-primary"></i>
                    </div>
                    <h2 class="h3">Choose New Password</h2>
                    <p class="text-muted">Enter the code sent to your email and your new password</p>
                </div>
                
                <form action="{{ url_for('reset_password') }}" method="POST">
                    <div class="mb-3">
                        <label for="code" class="form-label fw-600">Reset Code</label>
                        <input type="text" class="form-control text-center text-uppercase font-monospace fw-bold" id="code" name="code" placeholder="RESET123" required>
                        <small class="text-muted d-block mt-1">Hint: Use the default reset code <b>RESET123</b>.</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label fw-600">New Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-600">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 shadow">
                        Reset Password <i class="fa-solid fa-check ms-1"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
