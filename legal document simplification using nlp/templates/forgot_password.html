{% extends "base.html" %}

{% block content %}
<div class="container py-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="premium-card p-5 shadow-lg animate-fade-up">
                <div class="text-center mb-4">
                    <div class="stats-icon mx-auto mb-3">
                        <i class="fa-solid fa-key text-primary"></i>
                    </div>
                    <h2 class="h3">Reset Password</h2>
                    <p class="text-muted">Enter your email address to receive a recovery code</p>
                </div>
                
                <form action="{{ url_for('forgot_password') }}" method="POST">
                    <div class="mb-4">
                        <label for="email" class="form-label fw-600">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="john@example.com" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 mb-3 shadow">
                        Send Reset Code <i class="fa-solid fa-paper-plane ms-2"></i>
                    </button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="{{ url_for('login') }}" class="text-decoration-none small">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
