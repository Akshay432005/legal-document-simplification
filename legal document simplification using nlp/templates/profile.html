{% extends "base.html" %}

{% block content %}
<div class="container py-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="premium-card p-5 shadow-lg animate-fade-up">
                <div class="d-flex align-items-center mb-4 border-bottom pb-3">
                    <div class="stats-icon me-3">
                        <i class="fa-solid fa-user-gear text-primary"></i>
                    </div>
                    <div>
                        <h2 class="h4 mb-0">Account Settings</h2>
                        <p class="text-muted small mb-0">Manage password and profiles</p>
                    </div>
                </div>

                <form action="{{ url_for('profile') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control bg-light" value="{{ user['username'] }}" readonly disabled>
                        <small class="text-muted">Username cannot be changed.</small>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" value="{{ user['email'] }}" required>
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Leave blank to keep current">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 shadow">
                        Save Profile Changes <i class="fa-solid fa-save ms-1"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
