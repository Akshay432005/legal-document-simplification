{% extends "base.html" %}

{% block content %}
<div class="container py-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="premium-card p-5 shadow-lg text-center animate-fade-up">
                <div class="stats-icon mx-auto mb-3">
                    <i class="fa-solid fa-paper-plane text-primary"></i>
                </div>
                <h2 class="h3">Verify Your Email</h2>
                <p class="text-muted mb-4">We've sent a 6-digit verification code to your email. Please enter it below to complete registration.</p>
                
                <form action="{{ url_for('verify_email') }}" method="POST">
                    <div class="mb-4">
                        <input type="text" class="form-control form-control-lg text-center letter-spacing-lg" name="code" placeholder="123456" maxlength="6" required style="font-size: 1.8rem; font-weight: 700; letter-spacing: 5px;">
                        <small class="text-muted d-block mt-2">Hint: Use the default code <b>123456</b> for local testing.</small>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 shadow">
                        Verify Account <i class="fa-solid fa-circle-check ms-1"></i>
                    </button>
                </form>
                
                <div class="mt-4">
                    <a href="{{ url_for('register') }}" class="text-decoration-none small text-secondary">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Registration
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
